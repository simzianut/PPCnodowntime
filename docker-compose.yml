# Whole stack (decision 0066). Local: http://localhost:${HTTP_PORT:-8080}.
# Server: add docker-compose.server.yml (Traefik network + labels).
x-api: &api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: ppc-api:latest
  environment: &api-env
    DATABASE_URL: postgresql+psycopg://ppc:${POSTGRES_PASSWORD:-ppc}@ppc-db:5432/ppc
    DATA_DIR: /app/data

services:
  ppc-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ppc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppc}
      POSTGRES_DB: ppc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ppc -d ppc"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ppc-migrate:
    image: postgis/postgis:16-3.4
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppc}
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      ppc-db:
        condition: service_healthy
    restart: "no"

  # Writes to data/processed are masked by a tmpfs, so the host data stays untouched.
  # A failed seed must not block the API: the API falls back to in-memory state.
  ppc-seed:
    <<: *api
    command: ["sh", "-c", "python -m stations || echo 'seed failed (non-fatal)'"]
    volumes:
      - ./data:/app/data:ro
    tmpfs:
      - /app/data/processed
    depends_on:
      ppc-migrate:
        condition: service_completed_successfully
    restart: "no"

  ppc-api:
    <<: *api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      <<: *api-env
      API_FIXTURES: ${API_FIXTURES:-0}
      RL_AGENT: ${RL_AGENT:-auto}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    depends_on:
      ppc-db:
        condition: service_healthy
      ppc-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  ppc-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ppc-web:latest
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      ppc-api:
        condition: service_healthy
    restart: unless-stopped

  ppc-collector:
    <<: *api
    profiles: ["live"]
    user: "0:0"
    command: ["python", "-m", "dataset.live_collector"]
    environment:
      <<: *api-env
      AMPWHERE_ENABLED: ${AMPWHERE_ENABLED:-0}
      LIVE_POLL_S: ${LIVE_POLL_S:-300}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    volumes:
      - ./data/raw/live:/app/data/raw/live
    depends_on:
      ppc-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
