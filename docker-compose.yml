services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ppc
      POSTGRES_PASSWORD: ppc
      POSTGRES_DB: ppc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ppc -d ppc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
