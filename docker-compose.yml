# Whole stack (decision 0066). Local: http://localhost:${HTTP_PORT:-8080}.
# Server: add docker-compose.server.yml (Traefik network + labels).
x-api: &api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: ppc-api:latest
  # Caps for a shared production host (decision 0087). API_CPUS must be a whole number.
  cpus: ${API_CPUS:-4}
  mem_limit: ${API_MEM_LIMIT:-8g}
  environment: &api-env
    DATABASE_URL: postgresql+psycopg://ppc:${POSTGRES_PASSWORD:-ppc}@ppc-db:5432/ppc
    DATA_DIR: /app/data
    OMP_NUM_THREADS: ${API_CPUS:-4}
    MKL_NUM_THREADS: ${API_CPUS:-4}

services:
  ppc-db:
    image: postgis/postgis:16-3.4
    cpus: ${DB_CPUS:-1}
    mem_limit: ${DB_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: ppc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppc}
      POSTGRES_DB: ppc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ppc -d ppc"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ppc-migrate:
    image: postgis/postgis:16-3.4
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppc}
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      ppc-db:
        condition: service_healthy
    restart: "no"

  # Rewrites data/processed and data/raw/stations/location_id_map.csv (idempotent), so data/ is
  # writable here. A failed seed must not block the API, which has its own fallbacks.
  ppc-seed:
    <<: *api
    user: "0:0"
    command: ["sh", "-c", "python -m stations || echo 'seed failed (non-fatal)'"]
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data
    depends_on:
      ppc-migrate:
        condition: service_completed_successfully
    restart: "no"

  ppc-api:
    <<: *api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      <<: *api-env
      API_FIXTURES: ${API_FIXTURES:-0}
      # Access key (decision 0087): set PPC_ACCESS_KEY in .env, else a key is generated and logged.
      PPC_AUTH: ${PPC_AUTH:-on}
      PPC_ACCESS_KEY: ${PPC_ACCESS_KEY:-}
      RL_AGENT: ${RL_AGENT:-auto}
      # live mode (decisions 0070, 0072); empty LIVE_CLOCK_START = real time
      LIVE_CLOCK_START: ${LIVE_CLOCK_START:-}
      LIVE_SIGNALS: ${LIVE_SIGNALS:-mock}
      LIVE_CLOCK_SPEED: ${LIVE_CLOCK_SPEED:-1}
      LIVE_LAG_S: ${LIVE_LAG_S:-60}
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    depends_on:
      ppc-db:
        condition: service_healthy
      ppc-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  ppc-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ppc-web:latest
    cpus: ${WEB_CPUS:-0.5}
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      ppc-api:
        condition: service_healthy
    restart: unless-stopped

  ppc-collector:
    <<: *api
    profiles: ["live"]
    user: "0:0"
    # Exit 2 = deliberate stop (not enabled, or the site said stop; decision 0003): stay down.
    # Crashes and repeated poll failures (exit 1) get a few restarts only (decision 0086).
    command: ["sh", "-c", "python -m dataset.live_collector; rc=$$?; [ $$rc -eq 2 ] && exit 0; exit $$rc"]
    environment:
      <<: *api-env
      AMPWHERE_ENABLED: ${AMPWHERE_ENABLED:-0}
      LIVE_POLL_S: ${LIVE_POLL_S:-300}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    volumes:
      - ${DATA_HOST_DIR:-./data}/raw/live:/app/data/raw/live
    depends_on:
      ppc-migrate:
        condition: service_completed_successfully
    restart: "on-failure:5"

volumes:
  pgdata:
