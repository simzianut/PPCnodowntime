# M1 owns. Dundee donor ingest settings (spec 01 §3).
dundee:
  base_url: https://www.arcgis.com/sharing/rest/content/items/{item_id}/data
  files:
    - {name: dundee_ev_2021H2.csv, item_id: 189b838f51e74f6bb77509d91c47d7c0}
    - {name: dundee_ev_2022.csv, item_id: f1a6b5df441d4606821d5f1a78e92d7e}
    - {name: dundee_ev_2023.csv, item_id: 80df5f177b8c4a94b2bc692835801e8e}
    - {name: dundee_ev_2024.csv, item_id: 8b443deaf9174b7aa9d3e10eaa906422}
    - {name: dundee_ev_2025.csv, item_id: e185a3a1cfc948a69ada76e950b9d447}
  lat: 56.462
  lon: -2.9707
  start: "2021-07-01"
  end: "2025-08-31"
  split_date: "2023-12-31"   # local arrival date <= this is train
  min_session_s: 120
  max_session_s: 86400
  max_lanes: 2
  download_delay_s: 5
  user_agent: PPCnodowntime-hackathon (educational; contact via repo)
  power_class:
    ac: AC_22
    rapid: DC_50
    ultra_rapid: DC_HPC

# ChargePlace Scotland donor pool (Zenodo 19645933, CC BY 4.0). Opt-in via mapping.donors.
# Shares lat/lon/start/end/split_date with dundee: the Dundee weather series is reused.
cps:
  files:
    - {name: Sessions_from_ChargePlaceScotland.zip, url: "https://zenodo.org/records/19645933/files/Sessions_from_ChargePlaceScotland.zip?download=1"}
    - {name: infos_cpids.zip, url: "https://zenodo.org/records/19645933/files/infos_cpids.zip?download=1"}
  sessions_dir: Sessions_from_ChargePlaceScotland
  infos_dir: infos_cpids
  speed_file: CPID_and_charger_speed.xlsx
  local_authority_file: CPID_and_local_authority.xlsx
  postcode_file: CPID_and_postcode.xlsx
  public_private_file: CPID_public_private.xlsx
  exclude_dundee: true        # drop CPIDs that are in the Dundee donor set (no double counting)
  exclude_private: true       # drop CPIDs flagged Private (workplace/home units)
  min_session_s: 120
  max_session_s: 86400
  max_lanes: 2
  download_delay_s: 5
  user_agent: PPCnodowntime-hackathon (educational; contact via repo)
  power_class:
    ac: AC_22
    rapid: DC_50
    ultra-rapid: DC_HPC
  infer_kw_p95: {rapid: 25, ultra-rapid: 60}   # CPIDs missing from the speed file: p95 session mean kW

# County EV statistics (spec 01 section 7). Source licence: OGL-ROU-1.0.
county_ev:
  url: https://data.gov.ro/dataset/b93e0946-2592-4ed7-a520-e07cba6acd07/resource/3e30eb2a-5079-4421-9701-67cf346f972f/download/parc-auto-combistibil.csv
  file_name: parc-auto-combistibil.csv
  user_agent: PPCnodowntime-hackathon (educational; contact via repo)
  # Counties sharing one rate = sum(ev) / sum(population) * 1000.
  pool_groups:
    B_IF: [B, IF]

# Donor -> RO charge point mapping (spec 01 §4, T7).
mapping:
  donors: [dundee]                   # add cps to pool ChargePlace Scotland donors (util_quantile re-ranked over the union)
  seed: 20251107
  max_scale: 3.0                     # cap on target_rate / donor_rate
  min_donor_sessions_per_day: 0.0    # donors at or below this rate are never chosen
  session_id_width: 8
  declone_jitter_min: 20             # per-CP-per-day shift U(-j, +j) min against cloned timelines

# RO context features: Open-Meteo per county centroid (spec 01 §6, T7).
context:
  request_gap_s: 1.0     # pause between uncached requests
  retry_wait_s: 65       # wait after HTTP 429 (Open-Meteo per-minute limit)
  max_retries: 6
