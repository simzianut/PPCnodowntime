name: rl_ddqn
kind: rl
model: rl_ddqn
seed: 0
device: cpu
deterministic: true
total_timesteps: 1000000
data:
  sessions: sessions.parquet
  signals: signals.parquet
  context: context.parquet
  cp_active_days: cp_active_days.parquet
  # forecasts: /abs/path/runs/<t26_run_id>/forecasts.parquet   # absent = ZeroForecaster (warned)
params:
  lambda_wait: 0.1
  n_envs: 4
  torch_threads: 1
  net_arch: [64, 64]
  learning_rate: 0.001
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 2000
  exploration_fraction: 0.3
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  dc_oversample: 3.0
  n_val_days: 60
  n_val_episodes: 400
  eval_seed: 12345
  eval_every_steps: 250000
