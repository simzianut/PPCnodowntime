name: ablation_f2
# step 3 and 4 are rerun on the sensitivity signal files (decision 0052)
runs:
  # step 1_calendar_history
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history]
  # step 2_plus_traffic
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history, traffic]
  # step 3_plus_ev_flow
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history, traffic, ev_flow]
  # step 4_plus_intents
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history, traffic, ev_flow, intents]
  # step 3_ev_flow_evtag01
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history, traffic, ev_flow]
      data.signals: signals_evtag01.parquet
  # step 4_intents_papp03
  - config: config/train/f2_gru.yaml
    seeds: [0, 1, 2]
    set:
      params.feature_groups: [calendar_history, traffic, ev_flow, intents]
      data.signals: signals_papp03.parquet
summary_metrics: [test.overall.y15.auc, test.overall.y15.pr_auc, test.overall.y15.brier, test.overall.y30.auc, test.overall.y30.pr_auc, test.overall.y30.brier, test.overall.y60.auc, test.overall.y60.pr_auc, test.overall.y60.brier, test.overall.n60.poisson_deviance]
