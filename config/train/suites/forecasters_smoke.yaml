name: forecasters_smoke
# Small local check on real data: 20 CPs, a few hundred CP-days, 1 seed per model.
runs:
  - config: config/train/f0_seasonal.yaml
    seeds: [0]
    set: &small
      params.max_cps: 20
      params.n_train_cpdays: 300
      params.n_val_cpdays: 100
      params.n_test_cpdays: 150
  - config: config/train/f2_gru.yaml
    seeds: [0]
    set:
      <<: *small
      device: cpu
      params.epochs: 4
      params.samples_per_epoch: 60000
      params.batch_size: 512
      params.num_threads: 4
summary_metrics: [test.overall.y30.auc, test.overall.y30.pr_auc, test.overall.y30.brier]
